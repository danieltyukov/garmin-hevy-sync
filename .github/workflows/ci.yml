name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Shell scripts
        run: shellcheck site/install.sh bin/*.sh

  test:
    name: test / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  # Installs the tool the way users do, then registers, inspects and removes a
  # real background schedule with each OS's scheduler: cron on the Linux runner
  # (it has no systemd user session), launchd on macOS, Task Scheduler on Windows.
  install:
    name: install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GH_SYNC_HOME: ${{ github.workspace }}/.ci-home
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Installer (macOS, Linux)
        if: runner.os != 'Windows'
        run: GH_SYNC_SOURCE="$PWD" sh site/install.sh --no-setup
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GH_SYNC_SOURCE = (Get-Location).Path
          $env:GH_SYNC_NO_SETUP = '1'
          ./site/install.ps1
      - name: Put the tool directory on PATH
        shell: bash
        run: uv tool dir --bin >> "$GITHUB_PATH"
      - run: garmin-hevy-sync --version
      - run: gh-sync --help
      - run: garmin-hevy-sync status
      - run: garmin-hevy-sync schedule install --dry-run
      - run: garmin-hevy-sync schedule install
      - run: garmin-hevy-sync schedule status
      - run: garmin-hevy-sync schedule remove
      - name: A sync without credentials fails cleanly
        shell: bash
        run: |
          set +e
          garmin-hevy-sync sync
          code=$?
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: garmin-hevy-sync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm garmin-hevy-sync:ci --version
      - run: docker run --rm garmin-hevy-sync:ci status
      - run: docker compose config --quiet
