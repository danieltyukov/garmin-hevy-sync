[project]
name = "gh-sync"
version = "0.1.0"
description = "Two-way sync between a Garmin watch and Hevy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "hevy2garmin>=0.9.0",
    "garminconnect>=0.3.8",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gh-sync = "gh_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
