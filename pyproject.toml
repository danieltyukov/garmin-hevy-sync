[project]
name = "garmin-hevy-sync"
dynamic = ["version"]
description = "Two-way sync between a Garmin watch and Hevy, running in the background on Linux, macOS, Windows or Docker"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "danieltyukov" }]
requires-python = ">=3.12"
keywords = ["garmin", "garmin-connect", "hevy", "strength-training", "workout", "sync", "fitness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    # hevy2garmin's PyPI package stops releasing after 2026-10-31 (its npm
    # package replaces it). Pinned below the next minor so an unexpected final
    # release cannot change flows A and C under a running install.
    "hevy2garmin>=0.12.0,<0.13",
    "garminconnect>=0.3.17,<0.4",
    "requests>=2.33",
]

[project.urls]
Homepage = "https://danieltyukov.github.io/garmin-hevy-sync/"
Repository = "https://github.com/danieltyukov/garmin-hevy-sync"
Issues = "https://github.com/danieltyukov/garmin-hevy-sync/issues"
Changelog = "https://github.com/danieltyukov/garmin-hevy-sync/blob/main/CHANGELOG.md"

[project.scripts]
garmin-hevy-sync = "gh_sync.cli:main"
gh-sync = "gh_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/gh_sync/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_sync"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    # ruff format enforces the width for code; what remains is long strings
    # (the Windows task XML, the PowerShell toast script) that read better whole.
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
